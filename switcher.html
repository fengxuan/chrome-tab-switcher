<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chrome 标签切换器</title>
    <link rel="stylesheet" href="switcher.css">
  </head>
  <body>
    <main class="switcher-shell">
      <label class="search-box" for="search">
        <span class="search-icon">⌕</span>
        <input id="search" type="search" autocomplete="off" spellcheck="false" autofocus placeholder="搜索标题、网址或拼音…">
        <kbd id="search-shortcut">⌘ K</kbd>
      </label>

      <div id="empty" class="empty-state" hidden>
        <div class="empty-icon">⌁</div>
        <h2>没有匹配的标签页</h2>
        <p>换一个关键词试试，或清空搜索框查看全部标签。</p>
      </div>

      <div id="content" class="content" aria-live="polite">
        <div id="window-groups"></div>
      </div>

      <footer class="footer-hint">
        <span class="status-legend"><i class="legend-dot is-recent" aria-hidden="true"></i>最近切换</span>
        <span class="status-legend"><i class="legend-dot is-video" aria-hidden="true"></i>视频播放结束</span>
        <span><kbd>← ↑ ↓ →</kbd><kbd>Tab</kbd> 控制选择</span>
        <span><kbd>Enter</kbd> 打开</span>
        <span><kbd>Esc</kbd> 关闭</span>
      </footer>
    </main>

    <script src="vendor/pinyinjs/pinyin_dict_withtone.js"></script>
    <script src="vendor/pinyinjs/pinyinUtil.js"></script>
    <script src="switcher.js"></script>
  </body>
</html>
