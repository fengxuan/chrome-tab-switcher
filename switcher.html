<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chrome 标签切换器</title>
    <link rel="stylesheet" href="switcher.css">
  </head>
  <body>
    <main class="switcher-shell">
      <div class="search-controls">
        <button id="favorites-filter" class="favorites-filter" type="button" aria-pressed="false" aria-label="只显示收藏夹标签页" title="点击只显示收藏夹标签页">
          <span class="favorites-star" aria-hidden="true">★</span>
          <span id="favorites-filter-label">Favorites</span>
        </button>
        <label class="search-box" for="search">
          <span class="search-icon">⌕</span>
          <input id="search" type="search" inputmode="latin" autocomplete="off" autocapitalize="none" spellcheck="false" autofocus placeholder="搜索标题、网址或拼音…">
          <kbd id="search-shortcut">⌘ K</kbd>
        </label>
        <button id="native-apps-filter" class="native-apps-filter" type="button" aria-pressed="false" aria-label="只显示 macOS 原生应用窗口" title="点击只显示 macOS 原生应用窗口">
          <span class="native-apps-icon" aria-hidden="true">⌘</span>
          <span id="native-apps-filter-label">原生应用</span>
        </button>
      </div>
      <div id="native-status" class="native-status" hidden role="status"></div>

        <div id="empty" class="empty-state" hidden>
          <div class="empty-icon">⌁</div>
          <h2>没有匹配的标签页</h2>
          <p>换一个关键词试试，或清空搜索框查看全部标签。</p>
      </div>

      <div id="content" class="content" aria-live="polite">
        <div id="window-groups"></div>
      </div>

      <footer class="footer-hint">
        <button id="recent-filter" class="status-legend" type="button" aria-label="只显示最近切换的标签页" aria-pressed="false" title="点击只显示最近切换的标签页"><i class="legend-dot is-recent" aria-hidden="true"></i><span id="recent-filter-label">最近切换</span></button>
        <span class="smart-sleep-control">
          <button id="smart-sleep-settings" class="status-legend" type="button" aria-expanded="false" aria-controls="smart-sleep-panel" title="设置智能休眠">
            <i class="legend-dot is-sleeping" aria-hidden="true"></i><span id="smart-sleep-label">智能休眠</span>
          </button>
          <span id="smart-sleep-panel" class="smart-sleep-panel" hidden role="dialog" aria-labelledby="smart-sleep-panel-title">
            <strong id="smart-sleep-panel-title">智能休眠</strong>
            <label class="smart-sleep-option">
              <input id="smart-sleep-enabled" type="checkbox">
              <span id="smart-sleep-enabled-label">自动休眠闲置标签页</span>
            </label>
            <label class="smart-sleep-option smart-sleep-duration">
              <span id="smart-sleep-idle-label">空闲时长</span>
              <select id="smart-sleep-idle-minutes">
                <option value="30" data-message="smartSleepMinutes30">30 分钟</option>
                <option value="60" data-message="smartSleepMinutes60">1 小时</option>
                <option value="120" data-message="smartSleepMinutes120">2 小时</option>
                <option value="240" data-message="smartSleepMinutes240">4 小时</option>
                <option value="480" data-message="smartSleepMinutes480">8 小时</option>
              </select>
            </label>
            <p id="smart-sleep-protection-hint">正在播放、固定、最近访问或正在填写表单的标签页不会休眠。</p>
            <button id="smart-sleep-close" class="smart-sleep-close" type="button">完成</button>
          </span>
        </span>
        <span><kbd>← ↑ ↓ →</kbd><kbd>Tab</kbd> <span id="hint-control">控制选择</span></span>
        <span><kbd>Enter</kbd> <span id="hint-open">打开</span></span>
        <span><kbd>Esc</kbd> <span id="hint-close">关闭</span></span>
      </footer>
    </main>

    <script src="vendor/pinyinjs/pinyin_dict_withtone.js"></script>
    <script src="vendor/pinyinjs/pinyinUtil.js"></script>
    <script src="switcher.js"></script>
  </body>
</html>
